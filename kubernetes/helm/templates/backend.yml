apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: backend
  
  template:
    metadata:
      labels:
        app: backend
    
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{.Values.backend.image.tag }}"

          ports:
            - containerPort: {{ .Values.backend.port }}

          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/taskmanager"

          readinessProbe:
            httpGet:
              path: /api/tasks
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/tasks
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1            
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}