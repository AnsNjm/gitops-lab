stages:
  - test
  - build
  - gitops

variables:
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: "$DOCKERHUB_USERNAME/task-backend"
  FRONTEND_IMAGE: "$DOCKERHUB_USERNAME/task-frontend"

test:
  stage: test
  image: node:20
  script:
    - echo "Running Test stage"
    - cd ./mern-crud-app/backend
    - npm install
    - npm test || true

build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t "$BACKEND_IMAGE:$CI_COMMIT_SHA" ./mern-crud-app/backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"

build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHA" ./mern-crud-app/frontend/frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
  
update-helm:
  stage: gitops
  image: alpine:latest

  before_script:
    - apk add --no-cache git
    - apk add --no-cache yq
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@example.com"

  script: 
    - echo "CI_COMMIT_SHA = $CI_COMMIT_SHA"
    
    - echo "Before update:"
    - grep -n "tag:" kubernetes/helm/values.yaml

    - yq -i ".backend.image.tag = \"$CI_COMMIT_SHA\"" kubernetes/helm/values.yaml
    - yq -i ".frontend.image.tag = \"$CI_COMMIT_SHA\"" kubernetes/helm/values.YAML

    - echo "After update:"
    - grep -n "tag:" kubernetes/helm/values.yaml

    - git add kubernetes/helm/values.yaml
    - git diff --cached

    - 'git commit -m "chore: update images to $CI_COMMIT_SHA [skip ci]" || echo "No changes to commit"'

    - git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/ansnjm19/gitops-lab.git" HEAD:main
