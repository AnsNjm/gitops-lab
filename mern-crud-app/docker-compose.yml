services:

  backend:
    build: ./backend
    container_name: task-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/taskmanager
      PORT: 5000
    depends_on:
     - mongo

  frontend:
    build: ./frontend/frontend
    container_name: task-frontend
    ports:
     - "8080:80"
    depends_on:
     - backend

  mongo:
    image: mongo:8
    container_name: task-mongo
    ports:
     - "27017:27017"
    volumes:
     - mongo_data:/data/db
  
volumes:
  mongo_data: