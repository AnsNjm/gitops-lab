apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/AnsNjm/gitops-lab
    targetRevision: main
    path: kubernetes/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab-ns
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true